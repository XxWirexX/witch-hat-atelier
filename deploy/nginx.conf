# Grimoire — hébergement statique avec nginx.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/grimoire
#   sudo ln -s /etc/nginx/sites-available/grimoire /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d grimoire.exemple.fr     # HTTPS
#
# Remplace grimoire.exemple.fr par ton domaine.

server {
    listen 80;
    listen [::]:80;
    server_name grimoire.exemple.fr;

    root /var/www/grimoire;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Les modules ES exigent le bon type MIME, sinon le navigateur refuse de les charger.
    types { text/javascript js mjs; application/manifest+json webmanifest; }

    # Le code change à chaque déploiement : on le revalide, on ne le fige pas.
    location ~* \.(js|mjs|css|html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    # Tout tourne en local : aucune requête sortante n'est nécessaire.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'";

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.git {
        deny all;
    }
}
